name: Validate members

on:
  pull_request_target:
    paths:
      - 'members/*.json'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Overlay PR member files
        run: |
          git fetch origin pull/${{ github.event.pull_request.number }}/head
          git checkout FETCH_HEAD -- members

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run validation
        id: validate
        run: |
          set +e
          OUTPUT=$(node scripts/validate.mjs 2>&1)
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          {
            echo "output<<VALIDATION_EOF"
            echo "$OUTPUT"
            echo "VALIDATION_EOF"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Post PR comment
        uses: actions/github-script@v7
        env:
          VALIDATION_OUTPUT: ${{ steps.validate.outputs.output }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: process.env.VALIDATION_OUTPUT,
            });

      - name: Fail if validation failed
        if: steps.validate.outputs.exit_code != '0'
        run: exit 1
